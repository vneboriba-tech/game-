<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>МАССМЕДИА: Игра конференции</title>

  <!-- Шрифт, похожий на DIN Condensed Bold -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Oswald", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      background: radial-gradient(circle at top, #253663 0, #050918 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px 24px;
      min-height: 100vh;
      text-align: center;
    }

    /* Блок с логотипом в мягкой рамке */
    #logo-frame {
      padding: 8px 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(188,166,118,0.95), rgba(241,227,180,0.95));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
      max-width: 90vw;
    }

    #logo {
      display: block;
      max-width: 220px;
      height: auto;
      image-rendering: -webkit-optimize-contrast;
    }

    h1 {
      margin: 6px 0 2px;
      font-size: 22px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    #subtitle {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 12px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      max-width: 90vw;
    }

    #game-container {
      position: relative;
      border-radius: 16px;
      padding: 10px;
      background: linear-gradient(135deg, #bca676, #f1e3b4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      max-width: 100%;
    }

    canvas {
      display: block;
      background: #0b1630;
      border-radius: 12px;
      touch-action: none; /* чтобы не скроллилось при свайпе по игре */
      max-width: 100%;
      height: auto;
    }

    #ui-overlay {
      position: absolute;
      inset: 10px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 14px;
      color: #f5f5f5;
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    #controls {
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.85;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      max-width: 90vw;
    }

    #restart-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: #f1e3b4;
      color: #0b1630;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      display: none;
      font-family: "Oswald", system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #restart-btn:hover {
      filter: brightness(1.05);
    }

    #footer {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.3;
      opacity: 0.95;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      max-width: 90vw;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 18px;
      }
      #subtitle {
        font-size: 12px;
      }
      #ui-overlay {
        font-size: 12px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>
  <!-- ЛОГО В МЯГКОЙ РАМКЕ -->
  <div id="logo-frame">
    <img id="logo" src="logo.png" alt="МАССМЕДИА логотип">
  </div>

  <h1>МАССМЕДИА</h1>
  <div id="subtitle">Конференция российских соотечественников — мини-игра</div>

  <div id="game-container">
    <canvas id="game" width="640" height="420"></canvas>
    <div id="ui-overlay">
      <div id="score">Очки: 0</div>
      <div id="lives">Жизни: ❤️❤️❤️</div>
    </div>
    <button id="restart-btn">Играть ещё</button>
  </div>

  <div id="controls">
    ПК: стрелки ← → или клавиши A / D<br />
    Телефон: двигай человечка пальцем по экрану.
  </div>

  <div id="footer">
    Ксения Михайловна Конкина<br>
    журфак МГУ лучший 🤍
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const restartBtn = document.getElementById("restart-btn");

    let W = canvas.width;
    let H = canvas.height;

    // Под мобильный: уменьшаем визуальную ширину, чтобы всё влезало
    function resizeForMobile() {
      const maxWidth = Math.min(window.innerWidth - 40, 640);
      const ratio = maxWidth / 640;
      canvas.style.width = maxWidth + "px";
      canvas.style.height = 420 * ratio + "px";
    }
    resizeForMobile();
    window.addEventListener("resize", resizeForMobile);

    const player = {
      w: 70,
      h: 16,
      x: W / 2 - 35,
      y: H - 40,
      speed: 5,
      vx: 0
    };

    const itemsConfig = [
      { label: "Ташкент", emoji: "🕌" },
      { label: "Перо", emoji: "✒️" },
      { label: "Компьютер", emoji: "💻" },
      { label: "Лекция 1", emoji: "📖" },
      { label: "Практика", emoji: "📝" },
      { label: "Экскурсия", emoji: "🚌" },
      { label: "Знакомства", emoji: "🤝" }
    ];

    let items = [];
    let lives = 3;
    let score = 0;
    let lastSpawn = 0;
    let spawnInterval = 1200; // мс
    let gameOver = false;

    const keys = {
      left: false,
      right: false
    };

    function resetGame() {
      items = [];
      lives = 3;
      score = 0;
      spawnInterval = 1200;
      lastSpawn = 0;
      gameOver = false;
      player.x = W / 2 - player.w / 2;
      updateHUD();
      restartBtn.style.display = "none";
      requestAnimationFrame(loop);
    }

    function updateHUD() {
      scoreEl.textContent = "Очки: " + score;
      const hearts = "❤️".repeat(lives) + "🤍".repeat(3 - lives);
      livesEl.textContent = "Жизни: " + hearts;
    }

    function spawnItem(timestamp) {
      const cfg = itemsConfig[Math.floor(Math.random() * itemsConfig.length)];
      const radius = 26;
      const x = radius + Math.random() * (W - radius * 2);
      const speed = 1.8 + Math.random() * 1.7;

      items.push({
        x,
        y: -radius,
        r: radius,
        vy: speed,
        emoji: cfg.emoji,
        label: cfg.label
      });

      lastSpawn = timestamp;
    }

    function updatePlayer() {
      if (keys.left && !keys.right) {
        player.vx = -player.speed;
      } else if (keys.right && !keys.left) {
        player.vx = player.speed;
      } else {
        player.vx = 0;
      }
      player.x += player.vx;

      if (player.x < 10) player.x = 10;
      if (player.x + player.w > W - 10) player.x = W - 10 - player.w;
    }

    function updateItems() {
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.vy;

        const withinX =
          it.x + it.r > player.x && it.x - it.r < player.x + player.w;
        const withinY =
          it.y + it.r > player.y && it.y - it.r < player.y + player.h;

        if (withinX && withinY) {
          score += 1;
          if (spawnInterval > 500) {
            spawnInterval -= 15;
          }
          items.splice(i, 1);
          updateHUD();
          continue;
        }

        if (it.y - it.r > H) {
          items.splice(i, 1);
          lives -= 1;
          updateHUD();
          if (lives <= 0) {
            gameOver = true;
          }
        }
      }
    }

    function drawBackground() {
      const gradient = ctx.createRadialGradient(
        W / 2, H / 3, 10,
        W / 2, H / 3, H
      );
      gradient.addColorStop(0, "#1d2b55");
      gradient.addColorStop(1, "#050918");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
    }

    function drawPlayer() {
      ctx.save();
      ctx.fillStyle = "#f1e3b4";
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 8;

      const r = 8;
      const x = player.x, y = player.y, w = player.w, h = player.h;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x + w / 2, y - 12, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawItems() {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const it of items) {
        ctx.save();
        ctx.fillStyle = "#bca676";
        ctx.strokeStyle = "#f6f0d5";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#0b1630";
        ctx.font = "20px 'Oswald', system-ui, sans-serif";
        ctx.fillText(it.emoji, it.x, it.y - 5);

        ctx.font = "11px 'Oswald', system-ui, sans-serif";
        ctx.fillText(it.label, it.x, it.y + 13);

        ctx.restore();
      }
    }

    function drawGameOver() {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#f1e3b4";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.font = "28px 'Oswald', system-ui, sans-serif";
      ctx.fillText("Игра окончена", W / 2, H / 2 - 20);

      ctx.font = "16px 'Oswald', system-ui, sans-serif";
      ctx.fillText("Ваш результат: " + score + " очков", W / 2, H / 2 + 10);
      ctx.fillText("Вас ждет насыщенная программа!", W / 2, H / 2 + 36);

      ctx.restore();
      restartBtn.style.display = "block";
    }

    function loop(timestamp) {
      if (gameOver) {
        drawBackground();
        drawItems();
        drawPlayer();
        drawGameOver();
        return;
      }

      if (timestamp - lastSpawn > spawnInterval) {
        spawnItem(timestamp);
      }
      updatePlayer();
      updateItems();

      drawBackground();
      drawItems();
      drawPlayer();

      requestAnimationFrame(loop);
    }

    // Клавиатура (ПК)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "ф") {
        keys.left = true;
      }
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "в") {
        keys.right = true;
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "ф") {
        keys.left = false;
      }
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "в") {
        keys.right = false;
      }
    });

    // Тач-управление (телефон: двигаем человечка пальцем)
    function handleTouch(e) {
      e.preventDefault();
      const touch = e.touches[0];
      if (!touch) return;
      const rect = canvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      player.x = x - player.w / 2;
      if (player.x < 10) player.x = 10;
      if (player.x + player.w > W - 10) player.x = W - 10 - player.w;
    }

    canvas.addEventListener("touchstart", handleTouch, { passive: false });
    canvas.addEventListener("touchmove", handleTouch, { passive: false });
    canvas.addEventListener("touchend", (e) => {
      e.preventDefault();
    }, { passive: false });

    restartBtn.addEventListener("click", () => {
      resetGame();
    });

    updateHUD();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
